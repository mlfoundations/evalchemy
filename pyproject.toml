[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalchemy"
version = "0.1.0"
description = "Evalchemy Evaluation Framework"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
readme = "README.md"
requires-python = "==3.12.*"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core ML and Deep Learning
    # "vllm<0.10.2",
    # "flashinfer-python",
    "torch==2.7.0",
    "torchvision",
    "transformers==4.57.6",
    "triton==3.3.0",
    "accelerate",
    "peft",
    "trl",
    "bitsandbytes",
    "sentencepiece",
    "sentence-transformers",
    "optimum==1.12.0",

    # Machine Learning and Scientific Computing
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "faiss-cpu",

    # ML Experiment Tracking & Visualization
    "wandb",
    "tensorboard",
    "evaluate",

    # NLP & Text Processing
    "nltk",
    "fasttext-wheel",
    "codebleu",
    "sacrebleu",
    "langdetect",
    "fuzzywuzzy",
    "python-Levenshtein",

    # Data Processing & Parsing
    "datasets",
    "protobuf",
    "bs4",
    "lxml",
    "fastavro",
    "jsonpickle",
    "hjson",
    "msgpack",

    # AI Service Providers
    "openai",
    "anthropic",
    "cohere",
    "google-generativeai",
    "mistralai",
    "reka-api",
    "together",
    "dashscope",
    # "fschat @ file:eval/chat_benchmarks/MTBench",  # Use relative path that pip will resolve during installation

    # Cloud & Storage
    "gcsfs",
    "google-cloud-aiplatform",
    "google-auth",
    "boto3",
    "botocore",
    "sagemaker",
    "fsspec",
    "hf-transfer",
    "huggingface_hub[cli]",

    # Code Analysis & Development
    "black",
    "tree-sitter-python",
    "tree-sitter-java",
    "tree_sitter",
    "asttokens",
    "mypy_extensions",
    "pyext @ git+https://github.com/penfever/PyExt",

    # Web & API
    "fastapi>=0.101.0",
    "uvicorn>=0.23.0",
    "aiohttp[speedups]>=3.8",
    "httpx",
    "httpx-sse",
    "requests>=2.28",
    "websocket",
    "aiofiles",
    "bespokelabs-curator>=0.1.16.0",

    # Database
    "sqlalchemy",
    "psycopg[binary]",
    "psycopg2-binary",
    "sqlitedict",

    # Utilities
    "tqdm",
    "pqdm",
    "python-box",
    "fire",
    "tiktoken",
    "ray[default]",
    "backoff>=2.2",
    "docker-pycreds",
    "sentry-sdk",
    "loguru>=0.7",
    "python-dotenv",
    "shortuuid",
    "tenacity",
    "prettytable",
    "portalocker",
    "tabulate",
    "colorama",
    "termcolor",
    "distro",
    "typing_inspect",
    "py-cpuinfo",
    "jiter",
    "patsy",
    "joblib",
    "threadpoolctl",
    "jmespath",
    "immutabledict",

    # BigCodeBench
    "appdirs>=1.4.4",
    "multipledispatch>=0.6.0",
    "pqdm>=0.2.0",
    "tempdir>=0.7.1",
    "tree_sitter_languages>=1.10.2",
    "wget>=3.2",

    # SWE-bench
    "swebench>=3.0.4",

    # LM Eval
    "lm-eval @ git+https://github.com/EtashGuha/lm-evaluation-harness@etashg/tokenize_fix",

    # Utilities
    # "pdflatex==0.1.3",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128"},
]
torchvision = [
  { index = "pytorch-cu128"},
]
triton = [
  { index = "pytorch-cu128"},
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.urls]
Homepage = "https://github.com/mlfoundations/evalchemy"
Repository = "https://github.com/mlfoundations/evalchemy.git"

[project.optional-dependencies]
dev = ["pytest", "black", "isort", "flake8", "pre-commit", "isort"]

[tool.hatch.build.targets.wheel]
packages = ["evalchemy", "database"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.setuptools]
packages = ["evalchemy"]

[tool.setuptools.package-dir]
evalchemy = "evalchemy"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
